<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padhnex - AI Study Notes</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

nav{
  height:65px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#5b4df5;
}

.login{
  border:0;
  background:#5b4df5;
  color:#fff;
  padding:10px 18px;
  border-radius:10px;
}

.hero{
  text-align:center;
  padding:50px 20px 25px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero span{
  color:#5b4df5;
}

.hero p{
  color:#697386;
  line-height:1.6;
  max-width:650px;
  margin:auto;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.card h2{
  margin-bottom:18px;
}

.input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  margin-bottom:15px;
}

.input:focus{
  border-color:#5b4df5;
}

.upload{
  display:block;
  width:100%;
  padding:20px;
  border:2px dashed #ccc;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  margin-bottom:15px;
}

.upload input{
  display:none;
}

.generate{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#5b4df5;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.generate:disabled{
  opacity:.6;
}

.status{
  display:none;
  text-align:center;
  margin-top:18px;
  color:#5b4df5;
}

.result{
  display:none;
  margin-top:25px;
}

.result-box{
  background:#fff;
  padding:22px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.result-box h2{
  color:#5b4df5;
  margin-bottom:12px;
}

.result-box p,
.result-box li{
  line-height:1.7;
  color:#4d5668;
}

.result-box ul{
  padding-left:22px;
}

.mcq{
  margin-bottom:20px;
  line-height:1.7;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }

  .container{
    padding:15px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">Padhnex</div>
  <button class="login">Login</button>
</nav>

<section class="hero">
  <h1>Study Smarter with <span>Padhnex</span></h1>
  <p>
    YouTube videos, photos aur PDFs ko AI-powered
    study notes mein convert karo.
  </p>
</section>

<div class="container">

  <div class="card">

    <h2>✨ Create AI Notes</h2>

    <input
      id="youtubeUrl"
      class="input"
      type="url"
      placeholder="YouTube video link paste karo"
    >

    <label class="upload">
      📷 Upload Photo / PDF
      <input
        id="file"
        type="file"
        accept="image/*,.pdf"
      >
    </label>

    <button
      id="generateBtn"
      class="generate"
      onclick="generateNotes()"
    >
      ✨ Generate Notes
    </button>

    <div id="status" class="status">
      ⏳ Padhnex AI notes bana raha hai...
    </div>

  </div>

  <div id="result" class="result">

    <div class="result-box">
      <h2>📝 Summary</h2>
      <p id="summary"></p>
    </div>

    <div class="result-box">
      <h2>⭐ Important Points</h2>
      <ul id="points"></ul>
    </div>

    <div class="result-box">
      <h2>📚 Detailed Notes</h2>
      <p id="notes"></p>
    </div>

    <div class="result-box">
      <h2>❓ MCQs</h2>
      <div id="mcqs"></div>
    </div>

  </div>

</div>

<script>

async function generateNotes(){

  const youtubeUrl =
    document.getElementById("youtubeUrl").value.trim();

  const file =
    document.getElementById("file").files[0];

  if(!youtubeUrl && !file){
    alert("YouTube link ya Photo/PDF upload karo.");
    return;
  }

  const button =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");

  button.disabled = true;
  status.style.display = "block";

  try{

    const formData = new FormData();

    if(youtubeUrl){
      formData.append("youtubeUrl",youtubeUrl);
    }

    if(file){
      formData.append("file",file);
    }

    const response = await fetch(
      "/api/generate-notes",
      {
        method:"POST",
        body:formData
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "Notes generate nahi ho paye."
      );
    }

    document.getElementById("summary").innerText =
      data.summary || "";

    document.getElementById("notes").innerText =
      data.notes || "";

    const points =
      document.getElementById("points");

    points.innerHTML = "";

    (data.points || []).forEach(point => {

      const li = document.createElement("li");

      li.innerText = point;

      points.appendChild(li);

    });

    const mcqs =
      document.getElementById("mcqs");

    mcqs.innerHTML = "";

    (data.mcqs || []).forEach((mcq,index) => {

      const div = document.createElement("div");

      div.className = "mcq";

      div.innerHTML = `
        <strong>${index + 1}. ${mcq.question}</strong>
        <br>
        A. ${mcq.a}
        <br>
        B. ${mcq.b}
        <br>
        C. ${mcq.c}
        <br>
        D. ${mcq.d}
        <br>
        <strong>Answer: ${mcq.answer}</strong>
      `;

      mcqs.appendChild(div);

    });

    document.getElementById("result").style.display =
      "block";

  }catch(error){

    alert(error.message);

  }finally{

    button.disabled = false;
    status.style.display = "none";

  }

}

</script>

</body>
      </html>
